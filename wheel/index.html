<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台中轉轉樂</title>
<meta name="description" content="美食、桌遊密室、登山三個轉盤，轉一下決定在台中吃什麼、玩什麼、爬哪座山。">
<meta name="theme-color" content="#1f8f80" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16655b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台中轉轉樂">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<style>
  /* 版面：轉盤是主角，置中；下方是結果卡與可編輯的餐點清單。寬螢幕時左右並排。 */
  :root {
    --bg: #eef3f2;
    --surface: #ffffff;
    --fg: #14302e;
    --muted: #5a716e;
    --line: #cfdcda;
    --accent: #0f6b63;
    --accent-fg: #ffffff;
    --sun: #e3a21a;
    /* 頂部橫幅：五彩漸層（顏色比轉盤深一階，白字才看得清楚） */
    --hero-grad: linear-gradient(100deg, #c93a4a 0.0%, #c85d22 6.25%, #a87810 12.5%, #448a32 18.75%, #1f8f80 25.0%, #2f6fb8 31.25%, #6a4fb8 37.5%, #c04a8a 43.75%, #c93a4a 50.0%, #c85d22 56.25%, #a87810 62.5%, #448a32 68.75%, #1f8f80 75.0%, #2f6fb8 81.25%, #6a4fb8 87.5%, #c04a8a 93.75%, #c93a4a 100.0%);
    --hero-fg: #ffffff;
    --hero-muted: #fff3e0;
    --hero-title-accent: #fff1b8;
    --hero-line: rgba(255, 255, 255, .26);
    --hero-tab-bg: rgba(0, 0, 0, .22);
    --hero-tab-on: #ffffff;
    --hero-tab-on-fg: #23313a;
    /* 轉盤八色（五彩） */
    --seg-1: #e8505b;
    --seg-2: #f58b3a;
    --seg-3: #f6c344;
    --seg-4: #7cc35a;
    --seg-5: #2fb5a3;
    --seg-6: #3f8fdc;
    --seg-7: #8b6fd6;
    --seg-8: #e86aa8;
    --seg-ink-dark: #14302e;
    --seg-ink-light: #ffffff;
    --wheel-rim: #0d3b37;
    --wheel-bulb: #fff6dd;
    --wheel-shadow: rgba(4, 33, 30, .38);
    --font-display: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1918; --surface: #152422; --fg: #e4efed; --muted: #94aaa6; --line: #2a3f3c;
      --accent: #4cc1b3; --accent-fg: #0b1716; --sun: #f0b93f;
      --hero-grad: linear-gradient(100deg, #8f2a36 0.0%, #9a4a1e 6.25%, #86610d 12.5%, #376c29 18.75%, #16655b 25.0%, #214f83 31.25%, #4b3883 37.5%, #883562 43.75%, #8f2a36 50.0%, #9a4a1e 56.25%, #86610d 62.5%, #376c29 68.75%, #16655b 75.0%, #214f83 81.25%, #4b3883 87.5%, #883562 93.75%, #8f2a36 100.0%); --hero-fg: #f4f1ea; --hero-muted: #e6ddd0; --hero-title-accent: #ffe39a; --hero-line: rgba(255, 255, 255, .16); --hero-tab-bg: rgba(0, 0, 0, .32); --hero-tab-on: #f4f1ea; --hero-tab-on-fg: #1b2328;
      --seg-1: #d9434f; --seg-2: #e47b2c; --seg-3: #e5b336; --seg-4: #69b049; --seg-5: #24a191; --seg-6: #357fcb; --seg-7: #7a5ec4; --seg-8: #d65b97;
      --seg-ink-dark: #0e1918; --seg-ink-light: #ffffff;
      --wheel-rim: #1f5b55; --wheel-bulb: #fff1c9; --wheel-shadow: rgba(0, 0, 0, .55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1918; --surface: #152422; --fg: #e4efed; --muted: #94aaa6; --line: #2a3f3c;
    --accent: #4cc1b3; --accent-fg: #0b1716; --sun: #f0b93f;
    --hero-grad: linear-gradient(100deg, #8f2a36 0.0%, #9a4a1e 6.25%, #86610d 12.5%, #376c29 18.75%, #16655b 25.0%, #214f83 31.25%, #4b3883 37.5%, #883562 43.75%, #8f2a36 50.0%, #9a4a1e 56.25%, #86610d 62.5%, #376c29 68.75%, #16655b 75.0%, #214f83 81.25%, #4b3883 87.5%, #883562 93.75%, #8f2a36 100.0%); --hero-fg: #f4f1ea; --hero-muted: #e6ddd0; --hero-title-accent: #ffe39a; --hero-line: rgba(255, 255, 255, .16); --hero-tab-bg: rgba(0, 0, 0, .32); --hero-tab-on: #f4f1ea; --hero-tab-on-fg: #1b2328;
    --seg-1: #d9434f; --seg-2: #e47b2c; --seg-3: #e5b336; --seg-4: #69b049; --seg-5: #24a191; --seg-6: #357fcb; --seg-7: #7a5ec4; --seg-8: #d65b97;
    --seg-ink-dark: #0e1918; --seg-ink-light: #ffffff;
    --wheel-rim: #1f5b55; --wheel-bulb: #fff1c9; --wheel-shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    margin: 0;
  }
  .wrap {
    max-width: 980px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 24px;
  }
  /* 頂部橫幅：滿版漸層，延伸到手機狀態列底下 */
  .hero {
    position: relative; overflow: hidden;
    background: var(--hero-grad);
    background-size: 200% 100%;
    background-position: 0% 50%;
    color: var(--hero-fg);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: 18px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--hero-line) 0 22.5deg, transparent 22.5deg 45deg);
  }
  .hero::before { width: 340px; height: 340px; right: -110px; top: -120px; opacity: .55; }
  .hero::after { width: 160px; height: 160px; left: -60px; bottom: -80px; opacity: .35; }
  .is-spinning .hero::before { animation: hero-spin 1.2s linear infinite; }
  /* 轉動時五彩漸層跟著流動 */
  .is-spinning .hero { animation: hero-flow 2.4s linear infinite; }
  @keyframes hero-flow { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  @keyframes hero-spin { to { transform: rotate(360deg); } }
  .hero-in {
    position: relative; z-index: 1;
    max-width: 980px; margin: 0 auto; display: grid; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .sound-btn {
    margin-left: auto; align-self: flex-start; flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 .85rem var(--font-body); color: var(--hero-fg);
    background: var(--hero-tab-bg); border: 1px solid var(--hero-line); border-radius: 999px;
    padding: 6px 12px; min-height: 40px; cursor: pointer;
  }
  .sound-btn svg { width: 20px; height: 20px; }
  .sound-btn .ico-off { display: none; }
  .sound-btn[aria-pressed="false"] .ico-on { display: none; }
  .sound-btn[aria-pressed="false"] .ico-off { display: inline; }
  /* 音效開：五彩漸層＋白框；音效關：暗色、圖示變灰 */
  .sound-btn[aria-pressed="true"] {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 60%),
      linear-gradient(100deg, #6a4fb8, #c04a8a, #c93a4a, #c85d22);
    border-color: transparent;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 3px 10px rgba(0, 0, 0, .28);
    font-weight: 700;
  }
  .sound-btn[aria-pressed="false"] {
    background: rgba(0, 0, 0, .35); color: rgba(255, 255, 255, .78);
    border: 1px dashed rgba(255, 255, 255, .5);
  }
  .sound-btn[aria-pressed="false"] svg { color: rgba(255, 255, 255, .6); }
  .sound-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  @media (max-width: 380px) { .sound-label { display: none; } .sound-btn { padding: 6px 9px; } }
  .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
  .brand .logo {
    width: 60px; height: 60px; flex: none; border-radius: 22%;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28), 0 0 0 2px var(--hero-line);
  }
  .eyebrow { margin: 0; font-size: .82rem; letter-spacing: .12em; color: var(--hero-muted); }
  .hero h1 {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(1.9rem, 6.5vw, 2.7rem); line-height: 1.15; margin: 2px 0 0;
    letter-spacing: .02em;
  }
  .hero h1 span { color: var(--hero-title-accent); }
  .intro { margin: 0; color: var(--hero-muted); max-width: 40em; }
  @media (max-width: 600px) { .intro { min-height: 3.2em; } }

  .tabs {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px;
    background: var(--hero-tab-bg); border: 1px solid var(--hero-line); border-radius: 16px;
  }
  .tab {
    font: 700 .98rem var(--font-body); color: var(--hero-fg); background: transparent; border: 0;
    border-radius: 12px; min-height: 52px; padding: 6px 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .2s, color .2s;
  }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab:hover { background: rgba(255, 255, 255, .08); }
  /* 分頁各有自己的顏色：美食紅橘、桌遊密室藍紫、登山綠青 */
  #tab-food { --t1: #c93a4a; --t2: #c85d22; --t-light: #ffb48a; }
  #tab-games { --t1: #2f6fb8; --t2: #6a4fb8; --t-light: #b9b3ff; }
  #tab-hike { --t1: #448a32; --t2: #1f8f80; --t-light: #a6efb4; }
  .tab { position: relative; }
  .tab svg { color: var(--t-light); }
  .tab::after {
    content: ""; position: absolute; left: 26%; right: 26%; bottom: 5px; height: 3px; border-radius: 3px;
    background: var(--t-light); opacity: .9;
  }
  .tab[aria-selected="true"] {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .3), rgba(255, 255, 255, 0) 60%),
      linear-gradient(100deg, var(--t1), var(--t2));
    color: #ffffff;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, .92), 0 4px 12px rgba(0, 0, 0, .3);
  }
  .tab[aria-selected="true"] svg { color: #ffffff; }
  .tab[aria-selected="true"]::after { display: none; }
  .tab:disabled { cursor: wait; }
  .tab:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  @media (max-width: 340px) { .tab svg { display: none; } }
  @media (prefers-reduced-motion: reduce) { .is-spinning .hero::before, .is-spinning .hero { animation: none; } .tab { transition: none; } }

  .layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }

  .stage { display: grid; justify-items: center; gap: 16px; min-width: 0; }
  .wheel-box { position: relative; width: min(100%, 440px); aspect-ratio: 880 / 780; max-width: 100%; }
  .wheel-box canvas { width: 100%; height: 100%; display: block; }
  /* 立體轉盤：轉盤面往後傾斜，畫在 canvas 上；指針和中心鈕用 HTML 疊在上面 */
  .pointer {
    position: absolute; left: 50%; top: calc(10.6% - 40px); transform: translateX(-50%);
    width: 44px; height: 58px; z-index: 2;
    filter: drop-shadow(0 4px 3px rgba(0, 0, 0, .35));
  }
  .pointer svg { width: 100%; height: 100%; display: block; transform-origin: 50% 15%; transition: transform .07s ease-out; }
  .pointer.tick svg { transform: rotate(-14deg); }
  .wheel-box canvas { touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
  .wheel-box canvas.grabbing { cursor: grabbing; }
  .wheel-hint { margin: -6px 0 0; font-size: .85rem; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { .pointer svg { transition: none; } }
  .hub {
    position: absolute; left: 50%; top: 48.5%; transform: translate(-50%, -62%);
    width: 25%; aspect-ratio: 1.33; border-radius: 50%;
    /* 五彩轉鈕：上面是彩虹面＋光澤，底下用 ::before 畫出較暗的彩虹側邊 */
    --hub-rainbow: #e8505b, #f58b3a, #f6c344, #7cc35a, #2fb5a3, #3f8fdc, #8b6fd6, #e86aa8, #e8505b;
    isolation: isolate;
    background: transparent;
    border: 0;
    box-shadow: none;
    display: grid; place-items: center;
    font: 900 clamp(1rem, 4vw, 1.4rem) var(--font-display); color: #ffffff;
    text-shadow: 0 1px 0 rgba(0, 0, 0, .35), 0 2px 6px rgba(0, 0, 0, .45);
    cursor: pointer; padding: 0;
    transition: transform .08s, box-shadow .08s;
  }
  /* 側邊（往下的厚度）在最底層，彩虹面蓋在上面，字在最上面 */
  .hub::before {
    content: ""; position: absolute; z-index: -2;
    left: 0; right: 0; top: 9px; bottom: -9px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--hub-rainbow));
    filter: brightness(.6);
    border: 3px solid var(--wheel-rim);
    box-shadow: 0 8px 16px rgba(0, 0, 0, .35);
    transition: top .08s, bottom .08s;
  }
  .hub::after {
    content: ""; position: absolute; z-index: -1; inset: 0; border-radius: 50%;
    background:
      radial-gradient(ellipse at 36% 26%, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, .25) 32%, rgba(255, 255, 255, 0) 55%),
      conic-gradient(from 0deg, var(--hub-rainbow));
    border: 3px solid var(--wheel-rim);
  }
  .is-spinning .hub { animation: hub-hue 1.6s linear infinite; }
  @keyframes hub-hue { to { filter: hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .is-spinning .hub { animation: none; } }
  .hub:active:not(:disabled) { transform: translate(-50%, calc(-62% + 6px)); }
  .hub:active:not(:disabled)::before { top: 3px; bottom: -3px; }
  .hub:disabled { cursor: wait; }

  /* 「轉一下」：和頂部橫幅同一組深一階的五彩，白字才清楚 */
  .spin-btn {
    font: 800 1.15rem var(--font-body); letter-spacing: .08em;
    background:
      linear-gradient(180deg, rgba(255, 255, 255, .35) 0%, rgba(255, 255, 255, 0) 55%),
      var(--hero-grad);
    background-size: 100% 100%, 200% 100%;
    background-position: 0 0, 0% 50%;
    color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, .35);
    border: 0; border-radius: 999px; padding: 12px 40px; min-height: 52px; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0, 0, 0, .22), 0 8px 16px rgba(0, 0, 0, .18);
    transition: transform .08s, box-shadow .08s;
  }
  .spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0, 0, 0, .22), 0 3px 8px rgba(0, 0, 0, .18); }
  .spin-btn:disabled { cursor: wait; filter: saturate(.85); }
  .is-spinning .spin-btn { animation: btn-flow 1.2s linear infinite; }
  @keyframes btn-flow { from { background-position: 0 0, 0% 50%; } to { background-position: 0 0, 100% 50%; } }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .panel { display: grid; gap: 16px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
  /* 結果卡：彩虹外框＋上方彩虹細條 */
  .result {
    position: relative; overflow: hidden;
    border: 3px solid transparent; border-radius: 16px;
    background:
      linear-gradient(var(--surface), var(--surface)) padding-box,
      linear-gradient(100deg, var(--seg-1), var(--seg-2), var(--seg-3), var(--seg-4), var(--seg-5), var(--seg-6), var(--seg-7), var(--seg-8)) border-box;
    padding: 20px 18px 16px; min-height: 132px;
  }
  .result::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 6px;
    background: linear-gradient(100deg, var(--seg-1), var(--seg-2), var(--seg-3), var(--seg-4), var(--seg-5), var(--seg-6), var(--seg-7), var(--seg-8));
    opacity: .9;
  }
  .result .label {
    display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .08em; margin: 0;
    color: #ffffff; padding: 2px 10px; border-radius: 999px;
    background: var(--hero-grad); background-size: 200% 100%;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
  }
  .result .name { font: 900 clamp(1.6rem, 6vw, 2.2rem)/1.25 var(--font-display); margin: 4px 0; overflow-wrap: anywhere; }
  .result .meta { margin: 0; color: var(--muted); }
  .result .meta b { color: var(--fg); font-weight: 700; }
  .result.pop .name { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .result.win { animation: win-glow 1.4s ease-out; }
  @keyframes win-glow {
    0% { box-shadow: 0 0 0 0 rgba(227, 162, 26, .75); }
    35% { box-shadow: 0 0 0 10px rgba(227, 162, 26, .25); }
    100% { box-shadow: 0 0 0 18px rgba(227, 162, 26, 0); }
  }

  .box { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .box h2 { font-size: 1rem; margin: 0; }
  .filters, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter {
    font: 500 .95rem var(--font-body); color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; min-height: 38px; cursor: pointer;
  }
  .filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 4px 2px 12px; font-size: .92rem; max-width: 100%;
  }
  .chip span { overflow-wrap: anywhere; }
  .chip button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%; font-size: 1.1rem; line-height: 1;
  }
  .chip button:hover { color: var(--fg); background: var(--bg); }
  .chip.off { opacity: .4; }

  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px;
  }
  .add button, .reset {
    font: 500 .95rem var(--font-body); border-radius: 10px; cursor: pointer; min-height: 44px; padding: 8px 14px;
  }
  .add button { background: var(--fg); color: var(--bg); border: 0; }
  .reset { background: transparent; color: var(--muted); border: 1px solid var(--line); justify-self: start; }
  .hint { font-size: .85rem; color: var(--muted); margin: 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  /* 結果卡上的三個按鈕：各用一段深一階的彩虹漸層，白字才清楚 */
  .action {
    font: 700 .95rem var(--font-body); color: #ffffff; text-decoration: none;
    text-shadow: 0 1px 1px rgba(0, 0, 0, .3);
    background: linear-gradient(180deg, rgba(255, 255, 255, .28), rgba(255, 255, 255, 0) 60%), var(--action-grad);
    border: 0; border-radius: 999px;
    padding: 8px 16px; min-height: 42px; display: inline-flex; align-items: center; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  .action:hover { filter: brightness(1.08); }

  var STORE_PREFIX = "taichung-wheels-v1-";
  var TAB_KEY = "taichung-wheels-tab";

  var current = null;      // 目前的轉盤代號
  var conf = null;         // 目前轉盤的設定

  function copyDefaults() { return conf.defaults.map(function (d) { return Object.assign({}, d); }); }

  function defaultNames() { return conf.defaults.map(function (d) { return d.name; }); }

  // 讀取這個轉盤的資料。新版加入的預設選項會自動補進舊清單，
  // 但使用者自己移除過的預設選項不會再跑回來。
  function load() {
    var data = null;
    try {
      var raw = localStorage.getItem(STORE_PREFIX + current);
      if (raw) data = JSON.parse(raw);
    } catch (e) {}
    if (Array.isArray(data)) {
      // 舊格式只存選項陣列，當時的預設是沒有 added 標記的那些。
      data = { items: data, seen: conf.defaults.filter(function (d) { return !d.added; }).map(function (d) { return d.name; }), history: [] };
    }
    if (!data || !Array.isArray(data.items)) {
      items = copyDefaults();
      seen = defaultNames();
      history = [];
      return;
    }
    items = data.items;
    seen = Array.isArray(data.seen) ? data.seen : defaultNames();
    history = Array.isArray(data.history) ? data.history.slice(0, HISTORY_MAX) : [];
    var added = false;
    conf.defaults.forEach(function (d) {
      if (seen.indexOf(d.name) === -1) {
        seen.push(d.name);
        if (!items.some(function (it) { return it.name === d.name; })) items.push(Object.assign({}, d));
        added = true;
      }
    });
    if (added) save();
  }
  function save() {
    try {

    } catch (e) {}
  }

  function filter() { return filters[current] || "全部"; }
  function active() {
    var f = filter();
    return items.filter(function (it) { return f === "全部" || it.cat === f; });
  }

  function token(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  // 把 #rrggbb 顏色調暗或調亮（f < 1 變暗，f > 1 變亮）
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex);
    if (!m) return hex;
    var n = parseInt(m[1], 16), out = [];
    [16, 8, 0].forEach(function (sh) {
      var c = (n >> sh) & 255;
      c = f < 1 ? c * f : c + (255 - c) * (f - 1);
      out.push(Math.max(0, Math.min(255, Math.round(c))));

    return "rgb(" + out.join(",") + ")";
  }

  // 在八色之間平滑過渡，t 介於 0～1（繞一圈）
  function ringColor(palette, t) {
    var n = palette.length, x = t * n, i = Math.floor(x) % n, f = x - Math.floor(x);
    function rgb(h) { var v = parseInt(h.replace("#", ""), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
    var a = rgb(palette[i]), b = rgb(palette[(i + 1) % n]);
    var c = a.map(function (v, j) { return Math.round(v + (b[j] - v) * f); });
    return "#" + c.map(function (v) { return ("0" + v.toString(16)).slice(-2); }).join("");
  }

  // 判斷顏色亮不亮，決定字要用深色還是白色
  function isLight(hex) {

    ctx.restore();

    // 2. 轉盤的側面（厚度），左右兩邊加暗，看起來像圓柱
    var palette = [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return token("--seg-" + n); });
    var RING = 96;
    // 側面切成很多小片，每片用外圈在那個角度的顏色（較暗），跟著轉盤轉

    ctx.ellipse(cx, cy, fr, ry, 0, 0, Math.PI);
    ctx.ellipse(cx, cy + T, fr, ry, 0, Math.PI, 0, true);
    ctx.closePath();

    side.addColorStop(0.35, "rgba(255,255,255,.10)");
    side.addColorStop(0.65, "rgba(0,0,0,.05)");
    side.addColorStop(1, "rgba(0,0,0,.5)");
    ctx.fillStyle = side;
    ctx.fill();
    // 側面上的燈泡跟著轉

    for (var b = 0; b < BULBS; b++) {

      ctx.beginPath();
      ctx.ellipse(cx + fr * Math.cos(ba), cy + ry * sy + T * 0.5, 3.5 + 3 * sy, 5, 0, 0, Math.PI * 2);
      ctx.fillStyle = b % 2 ? "rgba(255,246,221,.35)" : "rgba(255,246,221,.8)";
      ctx.fill();
    }

    // 3. 轉盤面：外圈＋分格＋文字，全部畫在傾斜的平面上
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(1, TILT);
    ctx.rotate(rotation);
    for (var q = 0; q < RING; q++) {
      var q0 = q * TAU / RING, q1 = q0 + TAU / RING + 0.004;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, fr, q0, q1);
      ctx.closePath();
      ctx.fillStyle = shade(ringColor(palette, q / RING), 0.8);
      ctx.fill();
    }
    var sr = fr * 0.88;
    ctx.beginPath(); ctx.arc(0, 0, sr + 3, 0, TAU);
    ctx.fillStyle = shade(rim, 0.9); ctx.fill();
    if (!list.length) {
      ctx.beginPath(); ctx.arc(0, 0, sr, 0, Math.PI * 2);
      ctx.fillStyle = token("--surface"); ctx.fill();
    } else {
      var seg = Math.PI * 2 / list.length;
      for (var i = 0; i < list.length; i++) {

        if (i === list.length - 1 && list.length > 1 && colorIdx === 0) colorIdx = 3;

        ctx.closePath();
        ctx.fillStyle = segFill[colorIdx];
        ctx.fill();
        ctx.strokeStyle = "rgba(0,0,0,.14)";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        var mid = start + seg / 2;
        ctx.rotate(mid);

    ctx.beginPath();

    gloss.addColorStop(1, "rgba(0,0,0,.18)");
    ctx.fillStyle = gloss;
    ctx.fillRect(cx - fr, cy - ry, fr * 2, ry * 2);
    ctx.restore();

    // 5. 轉盤面的邊線
    ctx.beginPath();
    ctx.ellipse(cx, cy, fr, ry, 0, 0, Math.PI * 2);
    ctx.lineWidth = 4;
    ctx.strokeStyle = shade(rim, 0.6);
    ctx.stroke();

  function renderTabs() {
    tabs.forEach(function (t) {
      var on = t.dataset.key === current;

      t.tabIndex = on ? 0 : -1;
      t.disabled = spinning && !on;
    });
  }

  function renderFilters() {
    var box = document.getElementById("filters");
    box.replaceChildren();
    conf.cats.forEach(function (c) {
      var n = c === "全部" ? items.length : items.filter(function (it) { return it.cat === c; }).length;
      if (c === "自訂" && !n) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "filter";
      b.textContent = c + " " + n;
      b.setAttribute("aria-pressed", String(filter() === c));
      b.disabled = spinning;
      b.addEventListener("click", function () { filters[current] = c; renderAll(); });
      box.appendChild(b);
    });

  function renderChips() {
    var box = document.getElementById("chips");
    box.replaceChildren();
    var f = filter();
    items.forEach(function (it, idx) {
      var chip = document.createElement("span");
      chip.className = "chip" + (f === "全部" || it.cat === f ? "" : " off");
      var label = document.createElement("span");
      label.textContent = it.area ? it.name + "・" + it.area : it.name;
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", "移除 " + it.name);
      x.disabled = spinning;
      x.addEventListener("click", function () { items.splice(idx, 1); save(); renderAll(); });

      chip.appendChild(x);
      box.appendChild(chip);
    });

  var actionsBox = document.getElementById("result-actions");
  var mapLink = document.getElementById("result-map");
  var shareBtn = document.getElementById("result-share");
  var shareMsg = document.getElementById("share-msg");
  var avoidBox = document.getElementById("avoid-repeat");
  try { if (localStorage.getItem(AVOID_KEY) === "0") avoidBox.checked = false; } catch (e) {}

  function renderHistory() {
    var box = document.getElementById("history");
    box.replaceChildren();
    document.getElementById("history-clear").hidden = !history.length || spinning;
    if (!history.length) {
      var li = document.createElement("li");
      li.className = "empty";

      var li = document.createElement("li");

      what.className = "what";
      what.textContent = h.name;
      li.appendChild(when);
      li.appendChild(what);
      box.appendChild(li);

  function showActions(it) {

      mapLink.hidden = false;

      mapLink.hidden = true;

    actionsBox.hidden = false;

  function resetResult() {
    actionsBox.hidden = true;
    shareMsg.hidden = true;
    resultBox.classList.remove("pop");
    resultName.textContent = "按「轉一下」開始";
    resultMeta.textContent = "清單裡有 " + active().length + " 個選項。";
  }

  function renderAll() {
    var list = active();
    if (!list.length && filter() !== "全部") { filters[current] = "全部"; list = active(); }
    spinBtn.disabled = hub.disabled = spinning || list.length < 2;
    document.documentElement.classList.toggle("is-spinning", spinning);
    renderTabs();
    renderFilters();
    renderChips();
    renderHistory();
    draw();
  }

  function selectWheel(key, focusTab) {
    if (!WHEELS[key] || spinning) return;
    current = key;
    conf = WHEELS[key];
    load();
    lastResult = null;
    rotation = 0;
    document.getElementById("intro").textContent = conf.intro;
    document.getElementById("result-label").textContent = conf.label;
    document.getElementById("filter-title").textContent = conf.filterTitle;
    document.getElementById("add-input").placeholder = conf.placeholder;
    document.getElementById("data-hint").textContent = conf.hint + "按 × 可以移除選項，你的清單只會存在這個瀏覽器。";

  var TAU = Math.PI * 2;

    var candidates = list.map(function (_, i) { return i; });
    if (avoidBox.checked) {
      var skip = Math.min(history.length, Math.floor(list.length / 2));
      var recent = history.slice(0, skip).map(function (h) { return h.name; });
      var fresh = candidates.filter(function (i) { return recent.indexOf(list[i].name) === -1; });
      if (fresh.length) candidates = fresh;
    }

  }

  var pointerEl = document.querySelector(".pointer");
  var lastTickIdx = null, lastBuzz = 0, tickTimer = null;
  var SOUND_KEY = "taichung-wheels-sound";
  var soundOn = true;
  try { soundOn = localStorage.getItem(SOUND_KEY) !== "0"; } catch (e) {}
  var soundBtn = document.getElementById("sound-btn");
  var audioCtx = null, lastTickSound = 0;
  function renderSoundBtn() {
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.querySelector(".sound-label").textContent = soundOn ? "音效開" : "音效關";
    soundBtn.title = soundOn ? "按一下關閉音效" : "按一下開啟音效";
  }
  // 瀏覽器規定要在使用者點擊或觸碰時才能開始播放聲音
  function ensureAudio() {
    if (!soundOn) return null;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { return null; }
    return audioCtx;
  }
  function tone(ac, freq, at, len, type, vol) {
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at);
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(vol, at + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g); g.connect(ac.destination);
    o.start(at); o.stop(at + len + 0.02);
  }
  // 經過一格：短短的「喀」
  function playTick() {
    var ac = soundOn && audioCtx;
    if (!ac || ac.state !== "running") return;
    var now = performance.now();
    if (now - lastTickSound < 28) return;
    lastTickSound = now;
    var t = ac.currentTime;
    tone(ac, 1700 + Math.random() * 300, t, 0.035, "square", 0.05);
    tone(ac, 420, t, 0.03, "triangle", 0.06);
  }
  // 停下來：上升的「叮叮叮——」
  function playWin() {
    var ac = soundOn && ensureAudio();
    if (!ac) return;
    var t = ac.currentTime + 0.02;
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      tone(ac, f, t + i * 0.09, 0.32, "triangle", 0.16);
    });
    tone(ac, 1567.98, t + 0.36, 0.6, "sine", 0.1);
    tone(ac, 2093, t + 0.42, 0.5, "sine", 0.05);
  }
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "1" : "0"); } catch (e) {}
    renderSoundBtn();
    if (soundOn) { var ac = ensureAudio(); if (ac) tone(ac, 880, ac.currentTime + 0.01, 0.12, "triangle", 0.12); }
  });
  renderSoundBtn();

  // 慶祝動畫：從指針位置噴出彩帶
  var confettiCanvas = document.getElementById("confetti");
  var confettiCtx = confettiCanvas.getContext("2d");
  var confetti = [], confettiRunning = false;
  function celebrate() {
    if (prefersReduce()) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    confettiCanvas.width = innerWidth * dpr;
    confettiCanvas.height = innerHeight * dpr;
    confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var pr = pointerEl.getBoundingClientRect();
    var ox = pr.left + pr.width / 2, oy = pr.top + pr.height * 0.6;
    // 顏色：轉盤八色＋整圈彩虹色相＋粉彩＋金銀白，每片正反面顏色不同
    var palette = [1, 2, 3, 4, 5, 6, 7, 8].map(function (n) { return token("--seg-" + n); });
    var shiny = ["#ffd34d", "#f2c94c", "#e8eef2", "#c0c7cf", "#ffffff"];
    function pickColor() {
      var r = Math.random();
      if (r < 0.3) return palette[Math.floor(Math.random() * palette.length)];
      if (r < 0.65) return "hsl(" + Math.floor(Math.random() * 360) + ", 90%, " + (52 + Math.floor(Math.random() * 14)) + "%)";
      if (r < 0.85) return "hsl(" + Math.floor(Math.random() * 360) + ", 85%, 80%)";
      return shiny[Math.floor(Math.random() * shiny.length)];
    }
    var SHAPES = ["rect", "rect", "round", "strip", "star"];
    for (var i = 0; i < 190; i++) {
      var a = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.35;
      var sp = 5 + Math.random() * 9.5;
      var shape = SHAPES[Math.floor(Math.random() * SHAPES.length)];
      confetti.push({
        x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: 6 + Math.random() * 6, h: shape === "strip" ? 16 + Math.random() * 14 : 8 + Math.random() * 8,
        rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.4,
        color: pickColor(), back: pickColor(), life: 0, max: 95 + Math.random() * 55,
        shape: shape
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(stepConfetti); }
  }
  function stepConfetti() {
    confettiCtx.clearRect(0, 0, innerWidth, innerHeight);
    confetti = confetti.filter(function (c) { return c.life < c.max && c.y < innerHeight + 40; });
    confetti.forEach(function (c) {
      c.life++;
      c.vy += 0.22; c.vx *= 0.985; c.vy *= 0.985;
      c.x += c.vx; c.y += c.vy; c.rot += c.vr;
      confettiCtx.save();
      confettiCtx.globalAlpha = Math.max(0, 1 - c.life / c.max);
      confettiCtx.translate(c.x, c.y);
      confettiCtx.rotate(c.rot);
      // 翻面時換成背面的顏色，看起來像紙片在空中翻轉
      var flip = Math.cos(c.rot * 2);
      confettiCtx.fillStyle = flip >= 0 ? c.color : c.back;
      var squash = 0.35 + Math.abs(flip) * 0.65;
      if (c.shape === "round") {
        confettiCtx.beginPath(); confettiCtx.ellipse(0, 0, c.w / 2, c.w / 2 * squash, 0, 0, Math.PI * 2); confettiCtx.fill();
      } else if (c.shape === "star") {
        var R = c.w * 0.75, r2 = R * 0.45;
        confettiCtx.beginPath();
        for (var k = 0; k < 10; k++) {
          var ang = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r2 : R;
          confettiCtx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr * squash);
        }
        confettiCtx.closePath(); confettiCtx.fill();
      } else if (c.shape === "strip") {
        // 細長彩帶，兩端帶一點彎
        confettiCtx.beginPath();
        confettiCtx.moveTo(-c.w * 0.25, -c.h / 2);
        confettiCtx.quadraticCurveTo(c.w * 0.6, 0, -c.w * 0.25, c.h / 2);
        confettiCtx.lineTo(c.w * 0.25, c.h / 2);
        confettiCtx.quadraticCurveTo(c.w * 1.1, 0, c.w * 0.25, -c.h / 2);
        confettiCtx.closePath(); confettiCtx.fill();
      } else {
        confettiCtx.fillRect(-c.w / 2, -c.h / 4, c.w, c.h / 2 * squash);
      }
      confettiCtx.restore();
    });
    if (confetti.length) requestAnimationFrame(stepConfetti);
    else { confettiRunning = false; confettiCtx.clearRect(0, 0, innerWidth, innerHeight); }
  }

  function checkTick(n) {
    if (n < 2) return;
    var idx = indexAtPointer(n, rotation);
    if (lastTickIdx === null) { lastTickIdx = idx; return; }
    if (idx === lastTickIdx) return;
    lastTickIdx = idx;
    pointerEl.classList.add("tick");
    playTick();
    clearTimeout(tickTimer);
    tickTimer = setTimeout(function () { pointerEl.classList.remove("tick"); }, 70);
    var now = performance.now();
    if (navigator.vibrate && now - lastBuzz > 45) {
      lastBuzz = now;
      try { navigator.vibrate(6); } catch (e) {}
    }
  }

  function beginSpin() {
    spinning = true;
    renderAll();
    resultBox.classList.remove("pop");
    resultName.textContent = "轉轉轉……";
    resultMeta.textContent = "";
    actionsBox.hidden = true;
    shareMsg.hidden = true;
  }

  function finishSpin(list, pick) {
    rotation = ((rotation % TAU) + TAU) % TAU;
    spinning = false;
    var it = list[pick];
    resultName.textContent = it.name;
    resultMeta.replaceChildren();
    if (it.area) {
      var b = document.createElement("b");
      b.textContent = it.area;
      resultMeta.appendChild(b);
      if (it.note) resultMeta.appendChild(document.createTextNode("　"));
    }
    if (it.note) resultMeta.appendChild(document.createTextNode(it.note));
    if (!it.area && !it.note) resultMeta.textContent = "就決定是它了！";
    lastResult = it;
    history.unshift({ name: it.name, at: Date.now() });
    history = history.slice(0, HISTORY_MAX);
    save();
    showActions(it);
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    playWin();
    celebrate();
    resultBox.classList.remove("win");
    void resultBox.offsetWidth;
    resultBox.classList.add("pop");
    resultBox.classList.add("win");
    renderAll();
  }

  // 按按鈕：固定的加速再減速
  function spin() {
    var list = active();
    if (spinning || dragging || list.length < 2) return;
    ensureAudio();
    beginSpin();
    var seg = TAU / list.length;
    var cands = pickIndex(list);
    var pick = cands[Math.floor(Math.random() * cands.length)];
    var target = (pick + 0.5) * seg + (Math.random() - 0.5) * seg * 0.7;   // 指針停在這格中間附近
    var reduce = prefersReduce();
    var turns = reduce ? 1 : 5 + Math.floor(Math.random() * 3);
    var from = rotation;
    var delta = ((-target - from) % TAU + TAU) % TAU;
    var to = from + turns * TAU + delta;
    var duration = reduce ? 600 : 4200 + Math.random() * 800;
    var t0 = performance.now();
    lastTickIdx = indexAtPointer(list.length, rotation);
    function frame(now) {
      var t = Math.min(1, (now - t0) / duration);
      rotation = from + (to - from) * (1 - Math.pow(1 - t, 4));
      draw();
      checkTick(list.length);
      if (t < 1) { requestAnimationFrame(frame); return; }
      finishSpin(list, pick);
    }
    requestAnimationFrame(frame);
  }

  // 手指撥動：用放手時的速度開始轉，再平均減速停下。
  // 會在接近自然停止點的地方挑一個結果，讓轉動距離跟撥的力道相符。
  function flick(velocity) {
    var list = active();
    if (spinning || list.length < 2) return;
    var dir = velocity > 0 ? 1 : -1;
    var v = Math.min(Math.abs(velocity), 28);                 // 每秒弧度
    var reduce = prefersReduce();
    var decel = reduce ? 40 : 7;                              // 每秒平方弧度
    var natural = v * v / (2 * decel);
    var minTravel = reduce ? TAU * 0.5 : TAU * 1.2;
    var want = Math.max(natural, minTravel);
    var seg = TAU / list.length;
    var cands = pickIndex(list);
    // 從候選裡挑落點最接近自然停止點的幾個，再隨機選一個
    var options = cands.map(function (i) {
      var target = (i + 0.5) * seg + (Math.random() - 0.5) * seg * 0.6;
      var base = dir > 0 ? ((-target - rotation) % TAU + TAU) % TAU : ((rotation + target) % TAU + TAU) % TAU;
      var k = Math.max(0, Math.round((want - base) / TAU));
      var travel = base + k * TAU;
      if (travel < minTravel) travel += TAU;
      return { i: i, travel: travel, diff: Math.abs(travel - want) };
    }).sort(function (a, b) { return a.diff - b.diff; });
    var choice = options[Math.floor(Math.random() * Math.min(3, options.length))];
    var travel = choice.travel;
    var a = v * v / (2 * travel);                             // 讓初速剛好在這段距離內停下
    var duration = v / a;
    beginSpin();
    var from = rotation, t0 = performance.now();
    lastTickIdx = indexAtPointer(list.length, rotation);
    function frame(now) {
      var t = Math.min(duration, (now - t0) / 1000);
      rotation = from + dir * (v * t - a * t * t / 2);
      draw();
      checkTick(list.length);
      if (t < duration) { requestAnimationFrame(frame); return; }
      rotation = from + dir * travel;
      finishSpin(list, choice.i);
    }
    requestAnimationFrame(frame);
  }

  // 拖曳轉盤
  var dragging = false, dragAngle = 0, samples = [], dragMoved = 0;
  var wheelHint = document.getElementById("wheel-hint");
  function pointerAngle(e) {
    var r = canvas.getBoundingClientRect();
    var scale = canvas.width / r.width;
    var g = geo(canvas.width);
    var x = (e.clientX - r.left) * scale - g.cx;
    var y = ((e.clientY - r.top) * scale - g.cy) / TILT;      // 還原傾斜，算出轉盤面上的角度
    return { angle: Math.atan2(y, x), dist: Math.sqrt(x * x + y * y), fr: g.fr };
  }
  canvas.addEventListener("pointerdown", function (e) {
    if (spinning || active().length < 2) return;
    ensureAudio();
    var pa = pointerAngle(e);
    if (pa.dist > pa.fr * 1.05 || pa.dist < pa.fr * 0.12) return;
    dragging = true; dragMoved = 0;
    dragAngle = pa.angle;
    samples = [{ t: performance.now(), r: rotation }];
    lastTickIdx = indexAtPointer(active().length, rotation);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    canvas.classList.add("grabbing");
    e.preventDefault();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var pa = pointerAngle(e);
    var d = pa.angle - dragAngle;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    dragAngle = pa.angle;
    rotation += d;
    dragMoved += Math.abs(d);
    var now = performance.now();
    samples.push({ t: now, r: rotation });
    while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
    draw();
    checkTick(active().length);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove("grabbing");
    var now = performance.now();
    while (samples.length > 2 && now - samples[0].t > 100) samples.shift();
    var first = samples[0], last = samples[samples.length - 1];
    var dt = (last.t - first.t) / 1000;
    var vel = dt > 0.005 && now - last.t < 80 ? (last.r - first.r) / dt : 0;
    if (Math.abs(vel) > 3) {
      wheelHint.textContent = "也可以用手指按住轉盤，用力一撥";
      flick(vel);
    } else if (dragMoved > 0.05) {
      wheelHint.textContent = "撥快一點、放手，轉盤才會轉起來";
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("lostpointercapture", endDrag);

  spinBtn.addEventListener("click", spin);
  document.getElementById("result-again").addEventListener("click", spin);

  avoidBox.addEventListener("change", function () {
    try { localStorage.setItem(AVOID_KEY, avoidBox.checked ? "1" : "0"); } catch (e) {}
  });

  document.getElementById("history-clear").addEventListener("click", function () {
    history = [];
    save();
    renderHistory();
  });

  shareBtn.addEventListener("click", function () {
    if (!lastResult) return;
    var text = "台中轉轉樂幫我決定：" + conf.label + "「" + lastResult.name + "」" + (lastResult.area ? "（" + lastResult.area + "）" : "");
    var url = location.href.split("#")[0] + "#" + current;
    function done(msg) { shareMsg.textContent = msg; shareMsg.hidden = false; }
    if (navigator.share) {
      navigator.share({ title: "台中轉轉樂", text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text + " " + url).then(
        function () { done("已複製，可以貼到 LINE 或訊息給朋友。"); },
        function () { done(text + " " + url); }
      );
    } else {
      done(text + " " + url);
    }
  });
  hub.addEventListener("click", spin);

  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { selectWheel(t.dataset.key); });
    // 左右方向鍵切換分頁
    t.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      var next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
      selectWheel(next.dataset.key, true);
    });
  });

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("add-input");
    var name = input.value.trim();
    if (!name) return;
    items.push({ name: name, cat: "自訂", area: "", note: "" });
    input.value = "";
    save();
    renderAll();
  });

  document.getElementById("reset").addEventListener("click", function () {
    items = copyDefaults();
    filters[current] = "全部";
    save();
    renderAll();
    resetResult();
  });

  window.addEventListener("hashchange", function () {
    var key = location.hash.slice(1);
    if (WHEELS[key] && key !== current) selectWheel(key);
  });

  // 主題切換或字型載入完成時重畫，讓轉盤顏色與字型跟著更新。
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
  }
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  // 開啟時：網址指定的轉盤 > 上次用的轉盤 > 美食
  var startKey = location.hash.slice(1);
  if (!WHEELS[startKey]) {
    try { startKey = localStorage.getItem(TAB_KEY); } catch (e) { startKey = null; }
  }
  selectWheel(WHEELS[startKey] ? startKey : "food");
})();
</script>
<script>
  // 註冊 service worker，讓 App 可以安裝到手機並離線使用。
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  // iPhone 的 Safari 沒有安裝按鈕，提示使用者手動加入主畫面。
  (function () {
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var hint = document.getElementById("install-hint");
    if (!standalone && ios && hint) {
      hint.textContent = "想裝到手機：在 Safari 按「分享」→「加入主畫面」。";
      hint.hidden = false;
    }
  })();
</script>
</body>
</html>
