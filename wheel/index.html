<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台中轉轉樂</title>
<meta name="description" content="美食、桌遊密室、登山三個轉盤，轉一下決定在台中吃什麼、玩什麼、爬哪座山。">
<meta name="theme-color" content="#14857a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#143a36" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台中轉轉樂">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<style>
  /* 版面：轉盤是主角，置中；下方是結果卡與可編輯的餐點清單。寬螢幕時左右並排。 */
  :root {
    --bg: #eef3f2;
    --surface: #ffffff;
    --fg: #14302e;
    --muted: #5a716e;
    --line: #cfdcda;
    --accent: #0f6b63;
    --accent-fg: #ffffff;
    --sun: #e3a21a;
    --hero-top: #14857a;
    --hero-bottom: #0a4a44;
    --hero-fg: #fff8e7;
    --hero-muted: #cfe8e3;
    --hero-line: rgba(255, 248, 231, .22);
    --hero-tab-bg: rgba(4, 33, 30, .28);
    --hero-tab-on: #fff8e7;
    --hero-tab-on-fg: #0f6b63;
    --seg-1: #0f6b63;
    --seg-2: #e3a21a;
    --seg-3: #2f8f84;
    --seg-4: #f2c45a;
    --seg-ink-dark: #14302e;
    --seg-ink-light: #ffffff;
    --font-display: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    --font-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1918; --surface: #152422; --fg: #e4efed; --muted: #94aaa6; --line: #2a3f3c;
      --accent: #4cc1b3; --accent-fg: #0b1716; --sun: #f0b93f;
      --hero-top: #143a36; --hero-bottom: #0b1f1d; --hero-fg: #e4efed; --hero-muted: #9fc2bc; --hero-line: rgba(228, 239, 237, .16); --hero-tab-bg: rgba(0, 0, 0, .3); --hero-tab-on: #4cc1b3; --hero-tab-on-fg: #0b1716;
      --seg-1: #1f7f75; --seg-2: #d79a1c; --seg-3: #2d9e91; --seg-4: #e9bc4f;
      --seg-ink-dark: #0e1918; --seg-ink-light: #ffffff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1918; --surface: #152422; --fg: #e4efed; --muted: #94aaa6; --line: #2a3f3c;
    --accent: #4cc1b3; --accent-fg: #0b1716; --sun: #f0b93f;
    --hero-top: #143a36; --hero-bottom: #0b1f1d; --hero-fg: #e4efed; --hero-muted: #9fc2bc; --hero-line: rgba(228, 239, 237, .16); --hero-tab-bg: rgba(0, 0, 0, .3); --hero-tab-on: #4cc1b3; --hero-tab-on-fg: #0b1716;
    --seg-1: #1f7f75; --seg-2: #d79a1c; --seg-3: #2d9e91; --seg-4: #e9bc4f;
    --seg-ink-dark: #0e1918; --seg-ink-light: #ffffff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    margin: 0;
  }
  .wrap {
    max-width: 980px; margin: 0 auto; display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: 24px;
  }
  /* 頂部橫幅：滿版漸層，延伸到手機狀態列底下 */
  .hero {
    position: relative; overflow: hidden;
    background: linear-gradient(170deg, var(--hero-top), var(--hero-bottom));
    color: var(--hero-fg);
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    padding-bottom: 18px;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none;
    background: repeating-conic-gradient(from 0deg, var(--hero-line) 0 22.5deg, transparent 22.5deg 45deg);
  }
  .hero::before { width: 340px; height: 340px; right: -110px; top: -120px; opacity: .55; }
  .hero::after { width: 160px; height: 160px; left: -60px; bottom: -80px; opacity: .35; }
  .is-spinning .hero::before { animation: hero-spin 1.2s linear infinite; }
  @keyframes hero-spin { to { transform: rotate(360deg); } }
  .hero-in {
    position: relative; z-index: 1;
    max-width: 980px; margin: 0 auto; display: grid; gap: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand .logo {
    width: 60px; height: 60px; flex: none; border-radius: 22%;
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28), 0 0 0 2px var(--hero-line);
  }
  .eyebrow { margin: 0; font-size: .82rem; letter-spacing: .12em; color: var(--hero-muted); }
  .hero h1 {
    font-family: var(--font-display); font-weight: 900;
    font-size: clamp(1.9rem, 6.5vw, 2.7rem); line-height: 1.15; margin: 2px 0 0;
    letter-spacing: .02em;
  }
  .hero h1 span { color: var(--sun); }
  .intro { margin: 0; color: var(--hero-muted); max-width: 40em; }
  @media (max-width: 600px) { .intro { min-height: 3.2em; } }

  .tabs {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px;
    background: var(--hero-tab-bg); border: 1px solid var(--hero-line); border-radius: 16px;
  }
  .tab {
    font: 700 .98rem var(--font-body); color: var(--hero-fg); background: transparent; border: 0;
    border-radius: 12px; min-height: 52px; padding: 6px 4px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .2s, color .2s;
  }
  .tab svg { width: 20px; height: 20px; flex: none; }
  .tab:hover { background: rgba(255, 255, 255, .08); }
  .tab[aria-selected="true"] { background: var(--hero-tab-on); color: var(--hero-tab-on-fg); box-shadow: 0 2px 8px rgba(0, 0, 0, .2); }
  .tab:disabled { cursor: wait; }
  .tab:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  @media (max-width: 340px) { .tab svg { display: none; } }
  @media (prefers-reduced-motion: reduce) { .is-spinning .hero::before { animation: none; } .tab { transition: none; } }

  .layout { display: grid; gap: 24px; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 820px) { .layout { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); } }

  .stage { display: grid; justify-items: center; gap: 16px; min-width: 0; }
  .wheel-box { position: relative; width: min(100%, 440px); aspect-ratio: 1; max-width: 100%; }
  .wheel-box canvas { width: 100%; height: 100%; display: block; }
  .pointer {
    position: absolute; left: 50%; top: -6px; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 28px solid var(--fg);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .hub {
    position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%);
    width: 26%; aspect-ratio: 1; border-radius: 50%;
    background: var(--surface); border: 4px solid var(--fg);
    display: grid; place-items: center;
    font: 900 clamp(1rem, 4vw, 1.4rem) var(--font-display); color: var(--fg);
    cursor: pointer; padding: 0;
  }
  .hub:disabled { cursor: wait; }

  .spin-btn {
    font: 700 1.1rem var(--font-body);
    background: var(--accent); color: var(--accent-fg);
    border: 0; border-radius: 999px; padding: 12px 36px; min-height: 48px; cursor: pointer;
  }
  .spin-btn:disabled { opacity: .6; cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

  .panel { display: grid; gap: 16px; min-width: 0; grid-template-columns: minmax(0, 1fr); }
  .result {
    background: var(--surface); border: 2px solid var(--fg); border-radius: 14px;
    padding: 16px 18px; min-height: 132px;
  }
  .result .label { font-size: .8rem; letter-spacing: .08em; color: var(--muted); margin: 0; }
  .result .name { font: 900 clamp(1.6rem, 6vw, 2.2rem)/1.25 var(--font-display); margin: 4px 0; overflow-wrap: anywhere; }
  .result .meta { margin: 0; color: var(--muted); }
  .result .meta b { color: var(--fg); font-weight: 700; }
  .result.pop .name { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  .box { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .box h2 { font-size: 1rem; margin: 0; }
  .filters, .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .filter {
    font: 500 .95rem var(--font-body); color: var(--fg);
    background: transparent; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 14px; min-height: 38px; cursor: pointer;
  }
  .filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 4px 2px 12px; font-size: .92rem; max-width: 100%;
  }
  .chip span { overflow-wrap: anywhere; }
  .chip button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%; font-size: 1.1rem; line-height: 1;
  }
  .chip button:hover { color: var(--fg); background: var(--bg); }
  .chip.off { opacity: .4; }

  .add { display: flex; gap: 8px; }
  .add input {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-height: 44px;
  }
  .add button, .reset {
    font: 500 .95rem var(--font-body); border-radius: 10px; cursor: pointer; min-height: 44px; padding: 8px 14px;
  }
  .add button { background: var(--fg); color: var(--bg); border: 0; }
  .reset { background: transparent; color: var(--muted); border: 1px solid var(--line); justify-self: start; }
  .hint { font-size: .85rem; color: var(--muted); margin: 0; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .action {
    font: 500 .95rem var(--font-body); color: var(--fg); text-decoration: none;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 8px 14px; min-height: 40px; display: inline-flex; align-items: center; cursor: pointer;
  }
  .action:hover { border-color: var(--fg); }
  a.action:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  .share-msg { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }

  .box-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .link-btn { font: 500 .9rem var(--font-body); color: var(--muted); background: transparent; border: 0;
    padding: 6px 8px; min-height: 36px; cursor: pointer; text-decoration: underline; }
  .history { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .history li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
  .history .when { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .history .what { overflow-wrap: anywhere; }
  .history .empty { color: var(--muted); font-size: .9rem; }
  .toggle { display: flex; gap: 10px; align-items: center; font-size: .92rem; cursor: pointer; min-height: 40px; }
  .toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }

  @media (prefers-reduced-motion: reduce) { .result.pop .name { animation: none; } }
</style>

<header class="hero">
  <div class="hero-in">
    <div class="brand">
      <img class="logo" src="icons/icon-192.png" alt="" width="60" height="60">
      <div>
        <p class="eyebrow">吃什麼・玩什麼・爬哪座山</p>
        <h1>台中<span>轉轉樂</span></h1>
      </div>
    </div>
    <p class="intro" id="intro"></p>
    <nav class="tabs" role="tablist" aria-label="選擇轉盤">
      <button class="tab" type="button" role="tab" id="tab-food" data-key="food">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>
        <span>美食</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-games" data-key="games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <span>桌遊密室</span>
      </button>
      <button class="tab" type="button" role="tab" id="tab-hike" data-key="hike">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20 9 7l4 7 2-3 7 9Z"/><path d="m7.5 10 1.5 1.5L11 10"/></svg>
        <span>登山</span>
      </button>
    </nav>
  </div>
</header>

<div class="wrap">

  <div class="layout">
    <section class="stage" aria-label="轉盤">
      <div class="wheel-box">
        <canvas id="wheel" width="880" height="880" aria-hidden="true"></canvas>
        <div class="pointer" aria-hidden="true"></div>
        <button id="hub" class="hub" type="button" aria-label="轉動轉盤">轉！</button>
      </div>
      <button id="spin" class="spin-btn" type="button">轉一下</button>
    </section>

    <section class="panel">
      <div id="result" class="result" aria-live="polite">
        <p class="label" id="result-label"></p>
        <p class="name" id="result-name">按「轉一下」開始</p>
        <p class="meta" id="result-meta">清單裡有 <b id="count">0</b> 個選項。</p>
        <div class="actions" id="result-actions" hidden>
          <a class="action" id="result-map" href="#" target="_blank" rel="noopener" hidden>在 Google 地圖找</a>
          <button class="action" id="result-share" type="button">分享結果</button>
          <button class="action" id="result-again" type="button">再轉一次</button>
        </div>
        <p class="share-msg" id="share-msg" role="status" hidden></p>
      </div>

      <div class="box">
        <div class="box-head">
          <h2>最近轉到</h2>
          <button class="link-btn" id="history-clear" type="button" hidden>清除</button>
        </div>
        <ol class="history" id="history"></ol>
        <label class="toggle" for="avoid-repeat">
          <input type="checkbox" id="avoid-repeat" checked>
          <span>最近轉到的先跳過，不要連續抽到同一個</span>
        </label>
      </div>

      <div class="box">
        <h2 id="filter-title">只轉這一類</h2>
        <div class="filters" id="filters" role="group" aria-label="篩選類別"></div>
      </div>

      <div class="box">
        <h2>轉盤上的選項</h2>
        <div class="chips" id="chips"></div>
        <form class="add" id="add-form">
          <input id="add-input" type="text" maxlength="20" placeholder="" aria-label="新增選項">
          <button type="submit">加入</button>
        </form>
        <button class="reset" id="reset" type="button">恢復預設清單</button>
        <p class="hint" id="install-hint" hidden></p>
        <p class="hint" id="data-hint"></p>
      </div>
    </section>
  </div>
</div>

<script>
(function () {
  "use strict";
  // 三個轉盤的預設資料。每個轉盤的清單分開存在這個瀏覽器。
  var WHEELS = {
    food: {
      intro: "台中的老店名店太多，不知道先去哪一家？轉一下，讓轉盤幫你決定。",
      label: "今天就吃",
      filterTitle: "只轉這一類",
      placeholder: "加入你想吃的店",
      hint: "店家資料整理自網路文章，營業時間和地址可能變動，出發前請先確認。",
      map: function (it) { return "台中 " + it.name; },
      cats: ["全部", "小吃", "冰品飲料", "伴手禮", "逢甲夜市", "自訂"],
      defaults: [
        { name: "李海魯肉飯", cat: "小吃", area: "第二市場", note: "從下午賣到凌晨，第二市場的必吃魯肉飯。" },
        { name: "山河魯肉飯", cat: "小吃", area: "第二市場", note: "和李海各有擁護者的市場老店。" },
        { name: "顏記肉包", cat: "小吃", area: "第二市場", note: "在地人推薦的市場肉包。" },
        { name: "老蔡大麵焿", cat: "小吃", area: "市區", note: "約 40 年的大麵焿老店，一週只開兩天，先看粉專公告。" },
        { name: "老賴茶棧", cat: "冰品飲料", area: "第二市場", note: "市場裡的古早味紅茶老攤。" },
        { name: "春水堂 創始店", cat: "冰品飲料", area: "西區四維街", note: "被視為珍珠奶茶的發源店。" },
        { name: "一中豐仁冰", cat: "冰品飲料", area: "北區育才街", note: "約 70 年老店，蜜花豆、冰淇淋配酸梅冰。" },
        { name: "豐仁冰 創始店", cat: "冰品飲料", area: "一中商圈", note: "蜜豆、粉圓、芋圓配料豐富的冰品老店。" },
        { name: "宮原眼科", cat: "冰品飲料", area: "中區中山路", note: "日治時期眼科建築改成的冰淇淋與甜點店。" },
        { name: "太陽堂老店", cat: "伴手禮", area: "自由路二段 25 號", note: "1954 年創立，台中太陽餅的代表店家。" },
        { name: "23 號太陽餅", cat: "伴手禮", area: "自由路", note: "自由路上常被推薦的太陽餅老店。" },
        { name: "阿明師老店", cat: "伴手禮", area: "市區", note: "常被列入台中太陽餅名店。" },
        { name: "犁記餅店", cat: "伴手禮", area: "市區", note: "老字號餅店，常被列入台中太陽餅名店。" },
        { name: "金味坊太陽餅", cat: "伴手禮", area: "市區", note: "不加豬油與雞蛋，吃素的人也能吃。" },
        // 第 2 版新增：逢甲夜市（added 用來把新店家補進舊的清單）
        { name: "明倫蛋餅", cat: "逢甲夜市", area: "逢甲夜市", note: "現煎蛋餅，逢甲的招牌之一。", added: 2 },
        { name: "黃家麻油雞", cat: "逢甲夜市", area: "逢甲夜市", note: "推薦點麻油雞麵線湯。", added: 2 },
        { name: "翰記雞汁燒烤杏鮑菇", cat: "逢甲夜市", area: "逢甲夜市", note: "夜市烤杏鮑菇。", added: 2 },
        { name: "阿華黑輪店", cat: "逢甲夜市", area: "逢甲夜市", note: "據說開了約 40 年的老攤。", added: 2 },

  var STORE_PREFIX = "taichung-wheels-v1-";
  var TAB_KEY = "taichung-wheels-tab";

  var current = null;      // 目前的轉盤代號
  var conf = null;         // 目前轉盤的設定
  var items = [];          // 目前轉盤的選項
  var filters = {};        // 每個轉盤各自的篩選
  var seen = [];           // 這個瀏覽器已經收過的預設選項名稱
  var history = [];        // 最近轉到的結果 { name, at }
  var rotation = 0;
  var spinning = false;
  var lastResult = null;
  var HISTORY_MAX = 8;
  var AVOID_KEY = "taichung-wheels-avoid";

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var spinBtn = document.getElementById("spin");
  var hub = document.getElementById("hub");
  var resultBox = document.getElementById("result");
  var resultName = document.getElementById("result-name");
  var resultMeta = document.getElementById("result-meta");
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function copyDefaults() { return conf.defaults.map(function (d) { return Object.assign({}, d); }); }

  function defaultNames() { return conf.defaults.map(function (d) { return d.name; }); }

  // 讀取這個轉盤的資料。新版加入的預設選項會自動補進舊清單，
  // 但使用者自己移除過的預設選項不會再跑回來。
  function load() {
    var data = null;
    try {
      var raw = localStorage.getItem(STORE_PREFIX + current);
      if (raw) data = JSON.parse(raw);
    } catch (e) {}
    if (Array.isArray(data)) {
      // 舊格式只存選項陣列，當時的預設是沒有 added 標記的那些。
      data = { items: data, seen: conf.defaults.filter(function (d) { return !d.added; }).map(function (d) { return d.name; }), history: [] };
    }
    if (!data || !Array.isArray(data.items)) {
      items = copyDefaults();
      seen = defaultNames();
      history = [];
      return;
    }
    items = data.items;
    seen = Array.isArray(data.seen) ? data.seen : defaultNames();
    history = Array.isArray(data.history) ? data.history.slice(0, HISTORY_MAX) : [];
    var added = false;
    conf.defaults.forEach(function (d) {
      if (seen.indexOf(d.name) === -1) {
        seen.push(d.name);
        if (!items.some(function (it) { return it.name === d.name; })) items.push(Object.assign({}, d));
        added = true;
      }
    });
    if (added) save();
  }
  function save() {
    try {
      localStorage.setItem(STORE_PREFIX + current, JSON.stringify({ items: items, seen: seen, history: history }));
    } catch (e) {}
  }

  function filter() { return filters[current] || "全部"; }
  function active() {
    var f = filter();
    return items.filter(function (it) { return f === "全部" || it.cat === f; });
  }

  function token(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function draw() {
    var list = active();
    var W = canvas.width, R = W / 2;
    ctx.clearRect(0, 0, W, W);
    var segFill = [token("--seg-1"), token("--seg-2"), token("--seg-3"), token("--seg-4")];
    var inkLight = token("--seg-ink-light"), inkDark = token("--seg-ink-dark");
    var rim = token("--fg");

    ctx.save();
    ctx.translate(R, R);
    ctx.rotate(rotation);
    if (!list.length) {
      ctx.beginPath(); ctx.arc(0, 0, R - 8, 0, Math.PI * 2);
      ctx.fillStyle = token("--surface"); ctx.fill();
      ctx.restore(); drawRim(rim, R);
      return;
    }
    var seg = Math.PI * 2 / list.length;
    for (var i = 0; i < list.length; i++) {
      var start = -Math.PI / 2 + i * seg;
      var colorIdx = i % 4;
      // 選項數是 4 的倍數加 1 時，避免最後一格和第一格同色。
      if (i === list.length - 1 && list.length % 4 === 1 && list.length > 1) colorIdx = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R - 8, start, start + seg);
      ctx.closePath();
      ctx.fillStyle = segFill[colorIdx];
      ctx.fill();

      ctx.save();
      var mid = start + seg / 2;
      ctx.rotate(mid);
      // 字在轉盤左半邊時轉 180 度，讓字永遠是正的。
      var flip = Math.cos(mid + rotation) < 0;
      if (flip) ctx.rotate(Math.PI);
      ctx.textAlign = flip ? "left" : "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = (colorIdx % 2 === 0) ? inkLight : inkDark;
      var size = Math.max(22, Math.min(40, 360 / Math.max(list.length, 6)));
      ctx.font = "700 " + size + "px " + token("--font-display");
      var text = list[i].name;
      var maxW = R * 0.62;
      while (ctx.measureText(text).width > maxW && text.length > 1) text = text.slice(0, -1);
      if (text !== list[i].name) text = text.slice(0, -1) + "…";
      ctx.fillText(text, flip ? -(R - 34) : R - 34, 0);
      ctx.restore();
    }
    ctx.restore();
    drawRim(rim, R);
  }

  function drawRim(color, R) {
    ctx.beginPath();
    ctx.arc(R, R, R - 8, 0, Math.PI * 2);
    ctx.lineWidth = 10;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function renderTabs() {
    tabs.forEach(function (t) {
      var on = t.dataset.key === current;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      t.disabled = spinning && !on;
    });
  }

  function renderFilters() {
    var box = document.getElementById("filters");
    box.replaceChildren();
    conf.cats.forEach(function (c) {
      var n = c === "全部" ? items.length : items.filter(function (it) { return it.cat === c; }).length;
      if (c === "自訂" && !n) return;
      var b = document.createElement("button");
      b.type = "button";
      b.className = "filter";
      b.textContent = c + " " + n;
      b.setAttribute("aria-pressed", String(filter() === c));
      b.disabled = spinning;
      b.addEventListener("click", function () { filters[current] = c; renderAll(); });
      box.appendChild(b);
    });
  }

  function renderChips() {
    var box = document.getElementById("chips");
    box.replaceChildren();
    var f = filter();
    items.forEach(function (it, idx) {
      var chip = document.createElement("span");
      chip.className = "chip" + (f === "全部" || it.cat === f ? "" : " off");
      var label = document.createElement("span");
      label.textContent = it.area ? it.name + "・" + it.area : it.name;
      var x = document.createElement("button");
      x.type = "button";
      x.textContent = "×";
      x.setAttribute("aria-label", "移除 " + it.name);
      x.disabled = spinning;
      x.addEventListener("click", function () { items.splice(idx, 1); save(); renderAll(); });
      chip.appendChild(label);
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }

  var actionsBox = document.getElementById("result-actions");
  var mapLink = document.getElementById("result-map");
  var shareBtn = document.getElementById("result-share");
  var shareMsg = document.getElementById("share-msg");
  var avoidBox = document.getElementById("avoid-repeat");
  try { if (localStorage.getItem(AVOID_KEY) === "0") avoidBox.checked = false; } catch (e) {}

  function renderHistory() {
    var box = document.getElementById("history");
    box.replaceChildren();
    document.getElementById("history-clear").hidden = !history.length || spinning;
    if (!history.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "還沒有紀錄，轉一下就會出現在這裡。";
      box.appendChild(li);
      return;
    }
    history.forEach(function (h) {
      var li = document.createElement("li");
      var when = document.createElement("span");
      when.className = "when";
      var d = new Date(h.at);
      when.textContent = isNaN(d) ? "" : d.toLocaleString("zh-TW", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
      var what = document.createElement("span");
      what.className = "what";
      what.textContent = h.name;
      li.appendChild(when);
      li.appendChild(what);
      box.appendChild(li);
    });
  }

  function showActions(it) {
    var q = conf.map ? conf.map(it) : null;
    if (q) {
      mapLink.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
      mapLink.textContent = conf.mapLabel ? conf.mapLabel(it) : "在 Google 地圖找";
      mapLink.hidden = false;
    } else {
      mapLink.hidden = true;
    }
    shareMsg.hidden = true;
    actionsBox.hidden = false;
  }

  function resetResult() {
    actionsBox.hidden = true;
    shareMsg.hidden = true;
    resultBox.classList.remove("pop");
    resultName.textContent = "按「轉一下」開始";
    resultMeta.textContent = "清單裡有 " + active().length + " 個選項。";
  }

  function renderAll() {
    var list = active();
    if (!list.length && filter() !== "全部") { filters[current] = "全部"; list = active(); }
    spinBtn.disabled = hub.disabled = spinning || list.length < 2;
    document.documentElement.classList.toggle("is-spinning", spinning);
    renderTabs();
    renderFilters();
    renderChips();
    renderHistory();
    draw();
  }

  function selectWheel(key, focusTab) {
    if (!WHEELS[key] || spinning) return;
    current = key;
    conf = WHEELS[key];
    load();
    lastResult = null;
    rotation = 0;
    document.getElementById("intro").textContent = conf.intro;
    document.getElementById("result-label").textContent = conf.label;
    document.getElementById("filter-title").textContent = conf.filterTitle;
    document.getElementById("add-input").placeholder = conf.placeholder;
    document.getElementById("data-hint").textContent = conf.hint + "按 × 可以移除選項，你的清單只會存在這個瀏覽器。";
    try { localStorage.setItem(TAB_KEY, key); } catch (e) {}
    if (location.hash !== "#" + key) window.history.replaceState(null, "", "#" + key);
    renderAll();
    resetResult();
    if (focusTab) document.getElementById("tab-" + key).focus();
  }

  function spin() {
    var list = active();
    if (spinning || list.length < 2) return;
    spinning = true;
    renderAll();
    resultBox.classList.remove("pop");
    resultName.textContent = "轉轉轉……";
    resultMeta.textContent = "";

    var seg = Math.PI * 2 / list.length;
    var candidates = list.map(function (_, i) { return i; });
    if (avoidBox.checked) {
      // 跳過最近轉到的，但至少留一半的選項可以抽。
      var skip = Math.min(history.length, Math.floor(list.length / 2));
      var recent = history.slice(0, skip).map(function (h) { return h.name; });
      var fresh = candidates.filter(function (i) { return recent.indexOf(list[i].name) === -1; });
      if (fresh.length) candidates = fresh;
    }
    var pick = candidates[Math.floor(Math.random() * candidates.length)];
    var jitter = (Math.random() - 0.5) * seg * 0.7;
    var target = (pick + 0.5) * seg + jitter;   // 指針要停在這格的中間附近
    var TAU = Math.PI * 2;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    var turns = reduce ? 1 : 5 + Math.floor(Math.random() * 3);
    var from = rotation;
    var delta = ((-target - from) % TAU + TAU) % TAU;
    var to = from + turns * TAU + delta;
    var duration = reduce ? 600 : 4200 + Math.random() * 800;
    var t0 = performance.now();

    function frame(now) {
      var t = Math.min(1, (now - t0) / duration);
      var eased = 1 - Math.pow(1 - t, 4);
      rotation = from + (to - from) * eased;
      draw();
      if (t < 1) { requestAnimationFrame(frame); return; }
      rotation = to % TAU;
      spinning = false;
      var it = list[pick];
      resultName.textContent = it.name;
      resultMeta.replaceChildren();
      if (it.area) {
        var b = document.createElement("b");
        b.textContent = it.area;
        resultMeta.appendChild(b);
        if (it.note) resultMeta.appendChild(document.createTextNode("　"));
      }
      if (it.note) resultMeta.appendChild(document.createTextNode(it.note));
      if (!it.area && !it.note) resultMeta.textContent = "就決定是它了！";
      lastResult = it;
      history.unshift({ name: it.name, at: Date.now() });
      history = history.slice(0, HISTORY_MAX);
      save();
      showActions(it);
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      void resultBox.offsetWidth;
      resultBox.classList.add("pop");
      renderAll();
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener("click", spin);
  document.getElementById("result-again").addEventListener("click", spin);

  avoidBox.addEventListener("change", function () {
    try { localStorage.setItem(AVOID_KEY, avoidBox.checked ? "1" : "0"); } catch (e) {}
  });

  document.getElementById("history-clear").addEventListener("click", function () {
    history = [];
    save();
    renderHistory();
  });

  shareBtn.addEventListener("click", function () {
    if (!lastResult) return;
    var text = "台中轉轉樂幫我決定：" + conf.label + "「" + lastResult.name + "」" + (lastResult.area ? "（" + lastResult.area + "）" : "");
    var url = location.href.split("#")[0] + "#" + current;
    function done(msg) { shareMsg.textContent = msg; shareMsg.hidden = false; }
    if (navigator.share) {
      navigator.share({ title: "台中轉轉樂", text: text, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text + " " + url).then(
        function () { done("已複製，可以貼到 LINE 或訊息給朋友。"); },
        function () { done(text + " " + url); }
      );
    } else {
      done(text + " " + url);
    }
  });
  hub.addEventListener("click", spin);

  tabs.forEach(function (t, i) {
    t.addEventListener("click", function () { selectWheel(t.dataset.key); });
    // 左右方向鍵切換分頁
    t.addEventListener("keydown", function (e) {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      var next = tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length];
      selectWheel(next.dataset.key, true);
    });
  });

  document.getElementById("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = document.getElementById("add-input");
    var name = input.value.trim();
    if (!name) return;
    items.push({ name: name, cat: "自訂", area: "", note: "" });
    input.value = "";
    save();
    renderAll();
  });

  document.getElementById("reset").addEventListener("click", function () {
    items = copyDefaults();
    filters[current] = "全部";
    save();
    renderAll();
    resetResult();
  });

  window.addEventListener("hashchange", function () {
    var key = location.hash.slice(1);
    if (WHEELS[key] && key !== current) selectWheel(key);
  });

  // 主題切換或字型載入完成時重畫，讓轉盤顏色與字型跟著更新。
  if (window.matchMedia) {
    var mq = matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", draw);
  }
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);

  // 開啟時：網址指定的轉盤 > 上次用的轉盤 > 美食
  var startKey = location.hash.slice(1);
  if (!WHEELS[startKey]) {
    try { startKey = localStorage.getItem(TAB_KEY); } catch (e) { startKey = null; }
  }
  selectWheel(WHEELS[startKey] ? startKey : "food");
})();
</script>
<script>
  // 註冊 service worker，讓 App 可以安裝到手機並離線使用。
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  // iPhone 的 Safari 沒有安裝按鈕，提示使用者手動加入主畫面。
  (function () {
    var standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    var hint = document.getElementById("install-hint");
    if (!standalone && ios && hint) {
      hint.textContent = "想裝到手機：在 Safari 按「分享」→「加入主畫面」。";
      hint.hidden = false;
    }
  })();
</script>
</body>
</html>
